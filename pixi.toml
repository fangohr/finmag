[workspace]
name = "finmag"
version = "0.1.0"
description = "First-pass pixi environment for the Finmag Python 3 transition"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
setuptools = "*"
cython = "*"
cxx-compiler = "*"
make = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
pytest = "*"
fenics = "2019.1.0.*"
petsc4py = "*"
slepc4py = "*"
sundials = "*"
boost-cpp = "*"
libboost-python-devel = "*"
gmsh = "*"
netgen = "*"
# Conda-forge provides OOMMF directly, so M3 can run real OOMMF cross-code
# comparisons without reviving the old source-build path. [Codex GPT-5.4]
oommf = "*"

[feature.dolfinx.dependencies]
# Keep DOLFINx in a separate no-default-feature environment: current
# fenics-dolfinx builds require CPython 3.12+ and must not perturb the
# FEniCS-2019/Python-3.11 M2/M3 environment. [Codex gpt-5.5 high]
python = "3.12.*"
fenics-dolfinx = "0.10.*"
pytest = "*"
numpy = "*"
scipy = "*"
# Task 21: `pip` itself, so `python -m pip install -e .` in this environment
# resolves to THIS env's site-packages. Without it, a bare `pip` on PATH can
# silently resolve to an unrelated interpreter (e.g. the base conda/system
# pip) and install the editable package into the wrong place -- observed
# empirically before this was added; `python -m pip ...` plus this dependency
# closes that gap. [Claude Sonnet 5]
pip = "*"
setuptools = ">=68"
# Task 11a: toolchain to compile the array-only FK BEM native extension
# (`bem_arrays.so`) in this environment. libboost-python-devel provides the
# Boost.Python runtime the existing native modules already use; cxx-compiler and
# make provide g++/make, which the base dolfinx feature does not ship. This is a
# native-build toolchain addition, kept out of the runtime import path. [Claude Opus 4.8]
cxx-compiler = "*"
make = "*"
libboost-python-devel = "*"
# Task 20: native Sundials/CVODE backend. conda-forge `sundials` provides the
# CVODE/SUNLINSOL/SUNMATRIX/core shared libraries and SUNDIALS-7 headers the
# modernized native wrapper (`native/src/sundials/sundials_cvode_impl.h`)
# targets. Pinned to the 7.x major to match the legacy default env (7.2.1) that
# the wrapper's SUNContext/SUNNonlinSol/CVodeSetLinearSolver wiring was written
# against. The `sundials.so` module is dolfin-free (`-DFINMAG_NO_DOLFIN`,
# `bem_arrays` precedent) so this adds no libdolfin to the DOLFINx lane. [Claude
# Opus 4.8]
sundials = ">=7,<8"
# Task 18: mesh-tooling bridge. `gmsh`/`python-gmsh` provide the Gmsh Python API
# used by the ported mesh generators (`finmag.util.meshes`/`mesh_templates`),
# converted to `dolfinx.mesh` in-memory via `dolfinx.io.gmsh.model_to_mesh`
# (no dolfin-XML intermediates). gmsh is lazily imported inside the generators
# so `import finmag` never pulls it in. [Claude Opus 4.8]
gmsh = "*"
python-gmsh = "*"
# Task 23: build toolchain for the treecode/PBC BEM native extension
# (`treecode_bem.so`). Unlike `bem_arrays`/`sundials` (Boost.Python C++),
# `treecode_bem` is a Cython extension compiled from `.pyx` + pure-C kernels
# via its own `setup.py` (driven by the `native/Makefile` dolfinx lane), so it
# needs Cython at build time. It is a compile-time-only dependency: the module
# is dolfin-free and lazily imported, so `import finmag` never pulls Cython.
# [Claude Opus 4.8]
cython = "*"

[feature.dolfinx.activation.env]
# The DOLFINx port lane can now compile an array-only native surface
# (`bem_arrays.so`), and importing finmag can trigger that native `make` as a
# side effect. Keep those implicit builds from rewriting the tracked
# `src/finmag/__version__.py`, matching the WRITE_FINMAG_VERSION=0 convention the
# read-only validators already use. [Claude Opus 4.8]
WRITE_FINMAG_VERSION = "0"

[feature.dolfinx.tasks]
# These tasks are the frozen M4 prototype witness. Keep new production-port
# tests in the explicitly named dolfinx-src-* tasks below. [Codex GPT-5]
dolfinx-versions = "python dev/dolfinx/version_report.py"
dolfinx-import = "python -c \"from mpi4py import MPI; import dolfinx; print('dolfinx', dolfinx.__version__, 'rank', MPI.COMM_WORLD.rank)\""
dolfinx-smoke = "python -c \"from mpi4py import MPI; import numpy as np; from dolfinx import mesh, fem; m = mesh.create_unit_square(MPI.COMM_WORLD, 2, 2); V = fem.functionspace(m, ('Lagrange', 1)); u = fem.Function(V); u.interpolate(lambda x: x[0] + 2*x[1]); print('dofs', V.dofmap.index_map.size_global, 'sum', float(np.sum(u.x.array)))\""
dolfinx-prototype-pytest = "python -m pytest -q dev/dolfinx"
# Compatibility alias for commands recorded before the M4 gate was frozen.
dolfinx-pytest = "python -m pytest -q dev/dolfinx"
dolfinx-example = "python -m dev.dolfinx.relaxation_example --output /tmp/finmag-dolfinx-relaxation-summary.json"
dolfinx-restart-example = "python -m dev.dolfinx.restart_example --output /tmp/finmag-dolfinx-restart-state.json"
# Task 21: make `src/finmag` installable in this environment. `--no-deps`
# keeps this task from asking pip to (re)resolve numpy/scipy/etc: those are
# already provided by conda/pixi above, and letting pip touch them risks
# pulling in a second, PyPI-resolved copy that conflicts with the
# conda-provided one the FEM stack is linked against. `python -m pip` (not a
# bare `pip`) guarantees this resolves to *this* environment's pip module: a
# bare `pip` on PATH can silently resolve to an unrelated interpreter (e.g. the
# base conda/system pip) and install the editable package into the wrong
# place -- observed empirically while implementing this task. `--no-build-isolation`:
# `setuptools`/`wheel` are already in this pixi environment (added above), so
# a build isolation venv is redundant; without this flag, default build
# isolation still reaches out to PyPI to populate that venv even though
# `--no-deps` only affects the *installed* package's dependencies, not the
# transient build environment -- undesirable for a lane whose whole point is
# not depending on PyPI resolving this stack. [Claude Sonnet 5]
dolfinx-install-editable = "python -m pip install -e . --no-deps --no-build-isolation"
# Explicit, documented second step of the native-extension story (no build
# backend hook): compiles `bem_arrays.so` and `sundials.so` into
# `src/finmag/native/` via the existing `native/Makefile` dolfinx lane. This is
# not strictly required before running tests -- `finmag.native.init` already
# triggers the same `make` as an import side effect (`native_compiler.make_modules`)
# -- but running it explicitly right after the editable install gives a fast,
# visible failure if the native toolchain is broken, instead of surfacing
# inside the first test that happens to import `finmag.native`.
# WRITE_FINMAG_VERSION=0 keeps this from rewriting the tracked
# `src/finmag/__version__.py` (matching every other native-triggering task
# below). [Claude Sonnet 5]
dolfinx-native-build = "WRITE_FINMAG_VERSION=0 make -C native"
# Provenance check: `import finmag` must resolve under THIS checkout's `src/`
# tree (the editable install target), not some other installed copy. Task 21's
# packaging story only pays off if this prints a path inside the active
# working directory. [Claude Sonnet 5]
dolfinx-provenance-check = "python -c \"import finmag, os; resolved = os.path.abspath(finmag.__file__); expected_prefix = os.path.abspath(os.path.join(os.getcwd(), 'src', 'finmag')); assert resolved.startswith(expected_prefix), (resolved, expected_prefix); print(resolved)\""
# Future direct source slices opt in to these tasks as they become green; they
# are deliberately not part of the frozen prototype verifier. [Codex GPT-5]
#
# Task 21: these `dolfinx-src-*` tasks (and their MPI/native counterparts
# below) now run against the INSTALLED editable package
# (`dolfinx-install-editable`) instead of `PYTHONPATH=src`, finishing the
# "not the final M2 install story" note in `transition-notes.org`. Exactly one
# fallback task (`dolfinx-src-import-pythonpath-fallback`, just below) keeps
# the previous `PYTHONPATH=src` mechanism exercised during the transition,
# per the Task 21 brief; it is intentionally not renamed/duplicated for every
# other gate; the editable install is the supported path going forward.
# [Claude Sonnet 5]
dolfinx-src-import = "PYTHONDONTWRITEBYTECODE=1 python -c \"import finmag\""
dolfinx-src-import-pythonpath-fallback = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -c \"import finmag\""
# SR1 P2.1 folds the ported `finmag.example` / `set_logging_level` boundary
# checks into this existing gate (precedent: Task 19 folding
# `test_thin_film_demag_dolfinx.py` into `dolfinx-src-energies-pytest`).
# [Claude Opus 4.8]
dolfinx-src-import-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_import_boundary.py src/finmag/tests/test_example_dolfinx.py src/finmag/tests/test_plot_helpers_dolfinx.py"
dolfinx-src-field-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_field_dolfinx.py"
dolfinx-src-field-mpi = "PYTHONDONTWRITEBYTECODE=1 mpiexec -n 2 python -m finmag.tests.field_dolfinx_mpi_probe"
dolfinx-src-energies-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_energies_dolfinx.py src/finmag/tests/test_thin_film_demag_dolfinx.py src/finmag/tests/test_dw_fixed_energy_dolfinx.py"
dolfinx-src-energies-mpi = "PYTHONDONTWRITEBYTECODE=1 mpiexec -n 2 python -m finmag.tests.energies_dolfinx_mpi_probe"
dolfinx-src-effectivefield-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_effective_field_dolfinx.py"
dolfinx-src-effectivefield-mpi = "PYTHONDONTWRITEBYTECODE=1 mpiexec -n 2 python -m finmag.tests.effective_field_dolfinx_mpi_probe"
dolfinx-src-llg-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_llg_dolfinx.py"
# Task 31: the dedicated public field-array component-ordering contract (the
# anti-scramble net); asymmetric analytic layouts that tell blocked from
# interleaved and double-converted. [Claude Fable 5]
dolfinx-src-ordering-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_ordering_contract_dolfinx.py"
dolfinx-src-scipy-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_scipy_driver_dolfinx.py"
# SR1 P1.3: `Simulation`'s default `integrator_backend` is now "sundials", so
# this gate can reach the native `make` on first native import.
# WRITE_FINMAG_VERSION=0 keeps that build from rewriting the tracked version
# file. [Claude Opus 4.8]
dolfinx-src-simulation-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_simulation_dolfinx.py src/finmag/tests/test_magnetisation_patterns_dolfinx.py"
# Task 10: the aggregated deferred-surfaces sweep and the core Simulation
# smoke, both new for the first direct-source DOLFINx gate. [Claude Sonnet 5]
dolfinx-src-deferred-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_deferred_surfaces_dolfinx.py"
# SR1 P1.3: the smoke now runs on the restored "sundials" default, so it can
# trigger the native `make`; WRITE_FINMAG_VERSION=0 keeps that build from
# rewriting the tracked version file. [Claude Opus 4.8]
dolfinx-src-core-smoke = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m finmag.tests.simulation_dolfinx_smoke"
# Task 11a: the array-only FK BEM native surface, compiled and imported in the
# DOLFINx env with no legacy dolfin. WRITE_FINMAG_VERSION=0 keeps the native
# `make` from rewriting the tracked version file. [Claude Opus 4.8]
dolfinx-src-native-bem-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_native_bem_arrays_dolfinx.py"
# Task 11b: the direct DOLFINx FK demag port -- boundary-ordering pin against
# the 11a golden BEM, analytic uniform-cube demag factor, and coordinate-ordered
# legacy oracle comparisons (cube + barmini). WRITE_FINMAG_VERSION=0 keeps the
# native `make` (triggered on demag setup) from rewriting the version file.
# [Claude Opus 4.8]
dolfinx-src-demag-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_fk_demag_dolfinx.py"
# Task 23: the treecode + periodic (MacroGeometry) demag port -- the native
# `treecode_bem` Cython BEM kernels rebuilt for the DOLFINx env (no libdolfin),
# the single-tile periodic BEM pinned bit-for-bit to the 11a golden dense FK
# BEM, treecode-vs-dense-FK cross-checks (direct-sum + legacy-default accuracy),
# a treecode sphere demag factor, and periodic image-sum convergence + the
# analytic out-of-plane thin-film limit. WRITE_FINMAG_VERSION=0 keeps the native
# `make` (which now also builds treecode_bem.so) from rewriting the version
# file. [Claude Opus 4.8]
dolfinx-src-treecode-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_treecode_pbc_demag_dolfinx.py"
# Task 12: the direct DOLFINx restart + required output (NDT/VTK/XDMF) +
# scheduler port. WRITE_FINMAG_VERSION=0 keeps the native `make` (triggered by
# the end-to-end FK demag witness) from rewriting the tracked version file.
# [Claude Opus 4.8]
dolfinx-src-restart-output-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_restart_output_dolfinx.py"
# Task 13: the direct DOLFINx DMI port -- dmi_type dispatch, exact
# chirality/scaling pins, and coordinate-ordered legacy oracle comparisons
# (bulk 3D + interfacial). [Claude Sonnet 5]
dolfinx-src-dmi-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_dmi_dolfinx.py"
# Task 14: the direct DOLFINx cubic-anisotropy port -- legacy analytic
# reference values, cubic-symmetry easy/hard-axis ordering, axis-handling
# behavior, by-name deferrals, and a coordinate-ordered legacy oracle
# comparison. [Claude Sonnet 5] SR1 P1.3 made "sundials" the public default
# backend, so this gate can now reach the native `make`; WRITE_FINMAG_VERSION=0
# keeps that build from rewriting the tracked version file. [Claude Opus 4.8]
dolfinx-src-cubicanis-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_cubic_anisotropy_dolfinx.py"
# Task 15: the direct DOLFINx time-Zeeman (TimeZeeman/DiscreteTimeZeeman/
# TimeZeemanPython/OscillatingZeeman/DipolarField) and relax/hysteresis/
# hysteresis_loop port -- update/switch-off semantics (including two
# preserved legacy quirks), the OscillatingZeeman waveform, coordinate-
# ordered legacy oracle fixtures, the real-class EffectiveField auto-
# connection, and the Stoner-Wohlfarth-like switching + loop-closure
# witness. [Claude Sonnet 5] SR1 P1.3 made "sundials" the public default
# backend, so this gate can now reach the native `make`; WRITE_FINMAG_VERSION=0
# keeps that build from rewriting the tracked version file. [Claude Opus 4.8]
dolfinx-src-timezeeman-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_timezeeman_dolfinx.py src/finmag/tests/test_hysteresis_dolfinx.py"
# Task 16: field-valued material parameters (spatially varying Ms/A/K1/axis/D
# and cubic K1/K2/K3), spatially varying Gilbert alpha (per-node in the damping
# term and gamma_LL), and region energy/magnetisation accounting
# (mark_regions). Coordinate-ordered legacy oracle fixtures pin the DG0-vs-CG1
# coefficient placement and the varying-alpha RHS; a divergence pin makes the
# now-LIVE K2 native-typo deviation executable evidence. SR1 P1.3 made
# "sundials" the public default backend, so this gate can now reach the native
# `make`; WRITE_FINMAG_VERSION=0 keeps that build from rewriting the tracked
# version file. [Claude Opus 4.8]
dolfinx-src-varparams-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_variable_params_dolfinx.py"
# Task 18: the mesh-tooling bridge -- Gmsh Python-API generators + CSG template
# classes converted to dolfinx.mesh via dolfinx.io.gmsh.model_to_mesh, the
# preserved Netgen-CSG md5 hashing/naming contract, the XDMF caching contract,
# and an FK-demag-on-a-generated-sphere physics smoke. WRITE_FINMAG_VERSION=0
# keeps the native `make` (triggered by the demag smoke) from rewriting the
# tracked version file. [Claude Opus 4.8]
dolfinx-src-meshes-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_meshes_dolfinx.py"
# Task 20: the dolfin-free native Sundials/CVODE backend -- the modernized
# SUNDIALS-7 wrapper rebuilt for the DOLFINx env (bem_arrays precedent, no
# libdolfin), the SundialsIntegrator driver wired against the ported LLG
# (analytic jtimes + identity preconditioner default path), ported legacy ODE /
# reinit / nsteps invariants, and scipy-vs-sundials cross-backend agreement.
# WRITE_FINMAG_VERSION=0 keeps the native `make` (triggered on first native
# import) from rewriting the tracked version file. [Claude Opus 4.8]
dolfinx-src-sundials-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_sundials_driver_dolfinx.py"
# Task 22: the Slonczewski/Xiao and Zhang-Li spin-transfer torques transcribed
# into the ported LLG NumPy right-hand side (the compiled STT kernels are NOT
# rebuilt), coordinate-ordered legacy oracle fixtures (dm/dt + Zhang-Li discrete
# gradient field), analytic direction/scaling pins, Simulation pass-throughs,
# dynamics witnesses (Zhang-Li domain-wall displacement, Slonczewski tilt sign)
# and a scipy-vs-sundials cross-backend check. WRITE_FINMAG_VERSION=0 keeps the
# native `make` (triggered by the sundials cross-check) from rewriting the
# tracked version file. [Claude Opus 4.8]
dolfinx-src-stt-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_stt_dolfinx.py"
# Task 30: run the converted examples/ scripts as subprocesses against the
# installed package (the practical-parity witness). The heavy muMAG /
# long-dynamics examples run only with FINMAG_EXAMPLE_FULL=1. [Claude Opus 4.8]
dolfinx-src-examples-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 python -m pytest -q examples/test_examples_dolfinx.py"
# Task 26a: decision-free I/O/utility parity wins -- Field point-in-cell
# probing (Field.probe/Field.__call__, promoted from the Task 30
# exchange_demag density workaround into the shared
# finmag.field.evaluate_at_point helper), Field.get_spherical (analytic
# Cartesian<->spherical conversion), and Simulation.skyrmion_number/
# skyrmion_number_density_function (analytic topological-charge formula,
# restored after being dropped outright in Task 9). [Claude Sonnet 5]
dolfinx-src-io-utils-pytest = "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q src/finmag/tests/test_io_utils_dolfinx.py"
# Pre-source-edit evidence for the local owned/ghost Field contract. These are
# bounded probes, not production-package tests. [Codex GPT-5.6]
dolfinx-field-ownership-probe = "PYTHONDONTWRITEBYTECODE=1 python -m dev.dolfinx.field_ownership_probe"
dolfinx-field-ownership-probe-mpi = "PYTHONDONTWRITEBYTECODE=1 mpiexec -n 2 python -m dev.dolfinx.field_ownership_probe"
dolfinx-energy-box-probe = "PYTHONDONTWRITEBYTECODE=1 python -m dev.dolfinx.energy_box_probe"
dolfinx-energy-box-probe-mpi = "PYTHONDONTWRITEBYTECODE=1 mpiexec -n 2 python -m dev.dolfinx.energy_box_probe"

[environments]
dolfinx = { features = ["dolfinx"], no-default-feature = true }

[tasks]
# Keep the lazy import contract executable in the FEniCS-2019 environment as
# well as the focused DOLFINx source lane. [Codex GPT-5.6]
# SR1 P2.1 adds `test_example_dolfinx.py` here too: its
# `test_helpers_still_reexports_set_logging_level` check needs legacy dolfin,
# so this legacy lane is the only place it can actually execute (it skips in
# the dolfinx lane). Its dolfinx-requiring checks skip here in turn.
# [Claude Opus 4.8]
src-import-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_import_boundary.py src/finmag/tests/test_example_dolfinx.py"
# This is an M2 packaging probe around conda-forge FEniCS 2019, not an attempt
# to reproduce the exact Debian-snapshot DOLFIN 2017 stack. [Codex GPT-5.4]
import-finmag = "PYTHONPATH=src python -c \"import finmag; print(finmag)\""
barmini-construct = "PYTHONPATH=src python -c \"import finmag; sim = finmag.example.barmini(); print(sim.__class__.__name__)\""
# The verified pixi smoke path now exercises the default Sundials backend on
# top of conda-forge FEniCS 2019 and SUNDIALS 7. [Codex GPT-5.4]
barmini-smoke = "PYTHONPATH=src python -c \"import finmag; sim = finmag.example.barmini(); sim.run_until(1e-12); print(sim.t, sim.integrator_backend)\""
# Keep restart verification close to the existing Python 3 container witness so
# M2 covers state persistence as well as plain time integration. [Codex GPT-5.4]
restart-smoke = '''
PYTHONPATH=src python -c "import os, numpy as np, finmag; sim = finmag.example.barmini(name='barmini_restart_pixi_smoke'); sim.run_until(1e-11); sim.save_restart_data(); t_saved = sim.t; m_saved = sim.m.copy(); canonical_restart = sim.name + '-restart.npz'; assert os.path.exists(canonical_restart); sim.run_until(2e-11); sim.restart(); assert sim.t == t_saved; assert np.allclose(sim.m, m_saved); sim2 = finmag.example.barmini(name='barmini_restart_pixi_smoke_copy'); sim2.restart(canonical_restart); assert sim2.t == t_saved; assert np.allclose(sim2.m, m_saved); print('saved_time', t_saved); print('restarted_time', sim.t); print('copied_time', sim2.t); print('restart_file', canonical_restart)"
'''
# Keep a direct witness for the compiled FK BEM baseline: the larger demag
# tests depend on this native array entry point, so M3 should fail early if it
# disappears or stops producing finite matrices. [Codex gpt-5.5 high]
native-fk-bem-smoke = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python dev/bin/native-fk-bem-smoke.py"
# This is the first explicit FEniCS-2019 pytest gate beyond workflow smoke
