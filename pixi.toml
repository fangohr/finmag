[workspace]
name = "finmag"
version = "0.1.0"
description = "First-pass pixi environment for the Finmag Python 3 transition"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
setuptools = "*"
cython = "*"
cxx-compiler = "*"
make = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
pytest = "*"
fenics = "2019.1.0.*"
petsc4py = "*"
slepc4py = "*"
sundials = "*"
boost-cpp = "*"
libboost-python-devel = "*"
gmsh = "*"
netgen = "*"

[tasks]
# This is an M2 packaging probe around conda-forge FEniCS 2019, not an attempt
# to reproduce the exact Debian-snapshot DOLFIN 2017 stack. [Codex GPT-5.4]
import-finmag = "PYTHONPATH=src python -c \"import finmag; print(finmag)\""
barmini-construct = "PYTHONPATH=src python -c \"import finmag; sim = finmag.example.barmini(); print(sim.__class__.__name__)\""
# The verified pixi smoke path now exercises the default Sundials backend on
# top of conda-forge FEniCS 2019 and SUNDIALS 7. [Codex GPT-5.4]
barmini-smoke = "PYTHONPATH=src python -c \"import finmag; sim = finmag.example.barmini(); sim.run_until(1e-12); print(sim.t, sim.integrator_backend)\""
# Keep restart verification close to the existing Python 3 container witness so
# M2 covers state persistence as well as plain time integration. [Codex GPT-5.4]
restart-smoke = '''
PYTHONPATH=src python -c "import os, numpy as np, finmag; sim = finmag.example.barmini(name='barmini_restart_pixi_smoke'); sim.run_until(1e-11); sim.save_restart_data(); t_saved = sim.t; m_saved = sim.m.copy(); canonical_restart = sim.name + '-restart.npz'; assert os.path.exists(canonical_restart); sim.run_until(2e-11); sim.restart(); assert sim.t == t_saved; assert np.allclose(sim.m, m_saved); sim2 = finmag.example.barmini(name='barmini_restart_pixi_smoke_copy'); sim2.restart(canonical_restart); assert sim2.t == t_saved; assert np.allclose(sim2.m, m_saved); print('saved_time', t_saved); print('restarted_time', sim.t); print('copied_time', sim2.t); print('restart_file', canonical_restart)"
'''
# This is the first explicit FEniCS-2019 pytest gate beyond workflow smoke
# tests, built around the historical barmini-first acceptance subset. [Codex GPT-5.4]
barmini-suite = '''
PYTHONPATH=src python -m pytest -q src/finmag/tests/test_effective_field.py src/finmag/tests/test_writing_data.py src/finmag/drivers/tests/test_integrator_raises_exception_on_exceed_maxsteps.py src/finmag/tests/test_restart_simulation.py src/finmag/tests/test_sim_ode.py src/finmag/tests/test_applied_field.py src/finmag/tests/test_exchange_static.py src/finmag/tests/test_llg.py src/finmag/util/ode/tests/test_sundials_ode.py src/finmag/tests/test_energy_creation_with_variable_Ms.py src/finmag/tests/energy_density/test_energy_density.py src/finmag/tests/test_anis.py src/finmag/tests/test_dmi.py src/finmag/tests/test_dmi_terms.py src/finmag/tests/test_heun.py src/finmag/tests/test_spatially_varying_alpha.py src/finmag/tests/test_spatially_varying_anisotropy.py src/finmag/tests/test_unit_length.py src/finmag/tests/test_interactions_scale_linearly_with_m.py src/finmag/energies/exchange_test.py src/finmag/energies/anisotropy_test.py src/finmag/energies/cubic_anisotropy_test.py src/finmag/energies/demag/fk_demag_test.py src/finmag/energies/demag/fk_demag_2d_test.py src/finmag/energies/test_energies_in_regions.py src/finmag/energies/thin_film_demag_test.py src/finmag/tests/test_1d_domain_wall_profile_uniaxial_anisotropy.py
src/finmag/tests/zhangli/zhang_li_test.py src/finmag/tests/zhangli/stt_nonlocal_test.py src/finmag/tests/test_skyrmions.py src/finmag/tests/test_solid_angle.py src/finmag/tests/test_solid_angle_invariance.py src/finmag/physics/tests/neb/neb_test.py src/finmag/physics/llb/sllg_test.py src/finmag/util/meshes_test.py src/finmag/sim/sim_helpers_test.py
src/finmag/tests/test_meshes.py
src/finmag/util/mesh_templates_test.py
