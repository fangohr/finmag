[workspace]
name = "finmag"
version = "0.1.0"
description = "First-pass pixi environment for the Finmag Python 3 transition"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
setuptools = "*"
cython = "*"
cxx-compiler = "*"
make = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
pytest = "*"
fenics = "2019.1.0.*"
petsc4py = "*"
slepc4py = "*"
sundials = "*"
boost-cpp = "*"
libboost-python-devel = "*"
gmsh = "*"
netgen = "*"
# Conda-forge provides OOMMF directly, so M3 can run real OOMMF cross-code
# comparisons without reviving the old source-build path. [Codex GPT-5.4]
oommf = "*"

[feature.dolfinx.dependencies]
# Keep DOLFINx in a separate no-default-feature environment: current
# fenics-dolfinx builds require CPython 3.12+ and must not perturb the
# FEniCS-2019/Python-3.11 M2/M3 environment. [Codex gpt-5.5 high]
python = "3.12.*"
fenics-dolfinx = "0.10.*"
pytest = "*"
numpy = "*"
scipy = "*"
# Task 11a: toolchain to compile the array-only FK BEM native extension
# (`bem_arrays.so`) in this environment. libboost-python-devel provides the
# Boost.Python runtime the existing native modules already use; cxx-compiler and
# make provide g++/make, which the base dolfinx feature does not ship. This is a
# native-build toolchain addition, kept out of the runtime import path. [Claude Opus 4.8]
cxx-compiler = "*"
make = "*"
libboost-python-devel = "*"

[feature.dolfinx.activation.env]
# The DOLFINx port lane can now compile an array-only native surface
# (`bem_arrays.so`), and importing finmag can trigger that native `make` as a
# side effect. Keep those implicit builds from rewriting the tracked
# `src/finmag/__version__.py`, matching the WRITE_FINMAG_VERSION=0 convention the
# read-only validators already use. [Claude Opus 4.8]
WRITE_FINMAG_VERSION = "0"

[feature.dolfinx.tasks]
# These tasks are the frozen M4 prototype witness. Keep new production-port
# tests in the explicitly named dolfinx-src-* tasks below. [Codex GPT-5]
dolfinx-versions = "python dev/dolfinx/version_report.py"
dolfinx-import = "python -c \"from mpi4py import MPI; import dolfinx; print('dolfinx', dolfinx.__version__, 'rank', MPI.COMM_WORLD.rank)\""
dolfinx-smoke = "python -c \"from mpi4py import MPI; import numpy as np; from dolfinx import mesh, fem; m = mesh.create_unit_square(MPI.COMM_WORLD, 2, 2); V = fem.functionspace(m, ('Lagrange', 1)); u = fem.Function(V); u.interpolate(lambda x: x[0] + 2*x[1]); print('dofs', V.dofmap.index_map.size_global, 'sum', float(np.sum(u.x.array)))\""
dolfinx-prototype-pytest = "python -m pytest -q dev/dolfinx"
# Compatibility alias for commands recorded before the M4 gate was frozen.
dolfinx-pytest = "python -m pytest -q dev/dolfinx"
dolfinx-example = "python -m dev.dolfinx.relaxation_example --output /tmp/finmag-dolfinx-relaxation-summary.json"
dolfinx-restart-example = "python -m dev.dolfinx.restart_example --output /tmp/finmag-dolfinx-restart-state.json"
# Future direct source slices opt in to these tasks as they become green; they
# are deliberately not part of the frozen prototype verifier. [Codex GPT-5]
dolfinx-src-import = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -c \"import finmag\""
dolfinx-src-import-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_import_boundary.py"
dolfinx-src-field-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_field_dolfinx.py"
dolfinx-src-field-mpi = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src mpiexec -n 2 python -m finmag.tests.field_dolfinx_mpi_probe"
dolfinx-src-energies-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_energies_dolfinx.py"
dolfinx-src-energies-mpi = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src mpiexec -n 2 python -m finmag.tests.energies_dolfinx_mpi_probe"
dolfinx-src-effectivefield-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_effective_field_dolfinx.py"
dolfinx-src-effectivefield-mpi = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src mpiexec -n 2 python -m finmag.tests.effective_field_dolfinx_mpi_probe"
dolfinx-src-llg-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_llg_dolfinx.py"
dolfinx-src-scipy-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_scipy_driver_dolfinx.py"
dolfinx-src-simulation-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_simulation_dolfinx.py"
# Task 10: the aggregated deferred-surfaces sweep and the core Simulation
# smoke, both new for the first direct-source DOLFINx gate. [Claude Sonnet 5]
dolfinx-src-deferred-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_deferred_surfaces_dolfinx.py"
dolfinx-src-core-smoke = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m finmag.tests.simulation_dolfinx_smoke"
# Task 11a: the array-only FK BEM native surface, compiled and imported in the
# DOLFINx env with no legacy dolfin. WRITE_FINMAG_VERSION=0 keeps the native
# `make` from rewriting the tracked version file. [Claude Opus 4.8]
dolfinx-src-native-bem-pytest = "WRITE_FINMAG_VERSION=0 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_native_bem_arrays_dolfinx.py"
# Pre-source-edit evidence for the local owned/ghost Field contract. These are
# bounded probes, not production-package tests. [Codex GPT-5.6]
dolfinx-field-ownership-probe = "PYTHONDONTWRITEBYTECODE=1 python -m dev.dolfinx.field_ownership_probe"
dolfinx-field-ownership-probe-mpi = "PYTHONDONTWRITEBYTECODE=1 mpiexec -n 2 python -m dev.dolfinx.field_ownership_probe"
dolfinx-energy-box-probe = "PYTHONDONTWRITEBYTECODE=1 python -m dev.dolfinx.energy_box_probe"
dolfinx-energy-box-probe-mpi = "PYTHONDONTWRITEBYTECODE=1 mpiexec -n 2 python -m dev.dolfinx.energy_box_probe"

[environments]
dolfinx = { features = ["dolfinx"], no-default-feature = true }

[tasks]
# Keep the lazy import contract executable in the FEniCS-2019 environment as
# well as the focused DOLFINx source lane. [Codex GPT-5.6]
src-import-pytest = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q src/finmag/tests/test_import_boundary.py"
# This is an M2 packaging probe around conda-forge FEniCS 2019, not an attempt
# to reproduce the exact Debian-snapshot DOLFIN 2017 stack. [Codex GPT-5.4]
import-finmag = "PYTHONPATH=src python -c \"import finmag; print(finmag)\""
barmini-construct = "PYTHONPATH=src python -c \"import finmag; sim = finmag.example.barmini(); print(sim.__class__.__name__)\""
# The verified pixi smoke path now exercises the default Sundials backend on
# top of conda-forge FEniCS 2019 and SUNDIALS 7. [Codex GPT-5.4]
barmini-smoke = "PYTHONPATH=src python -c \"import finmag; sim = finmag.example.barmini(); sim.run_until(1e-12); print(sim.t, sim.integrator_backend)\""
# Keep restart verification close to the existing Python 3 container witness so
# M2 covers state persistence as well as plain time integration. [Codex GPT-5.4]
restart-smoke = '''
PYTHONPATH=src python -c "import os, numpy as np, finmag; sim = finmag.example.barmini(name='barmini_restart_pixi_smoke'); sim.run_until(1e-11); sim.save_restart_data(); t_saved = sim.t; m_saved = sim.m.copy(); canonical_restart = sim.name + '-restart.npz'; assert os.path.exists(canonical_restart); sim.run_until(2e-11); sim.restart(); assert sim.t == t_saved; assert np.allclose(sim.m, m_saved); sim2 = finmag.example.barmini(name='barmini_restart_pixi_smoke_copy'); sim2.restart(canonical_restart); assert sim2.t == t_saved; assert np.allclose(sim2.m, m_saved); print('saved_time', t_saved); print('restarted_time', sim.t); print('copied_time', sim2.t); print('restart_file', canonical_restart)"
'''
# Keep a direct witness for the compiled FK BEM baseline: the larger demag
# tests depend on this native array entry point, so M3 should fail early if it
# disappears or stops producing finite matrices. [Codex gpt-5.5 high]
native-fk-bem-smoke = "PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python dev/bin/native-fk-bem-smoke.py"
# This is the first explicit FEniCS-2019 pytest gate beyond workflow smoke
# tests, built around the historical barmini-first acceptance subset. [Codex GPT-5.4]
