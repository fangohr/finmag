name: python3-m1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python3-m1:
    runs-on: ubuntu-latest
    # Task 32 (2026-07-22): M1 gates Python-3-on-legacy-dolfin-2017 usability.
    # `pixi` is the frozen legacy oracle for M1-M3 (docs/superpowers/HANDOVER.md
    # branch lineage). `dolfinx-parity` has ported src/finmag/field.py to import
    # `dolfinx` unconditionally (direct-source DOLFINx port, Tasks 3-31), so the
    # legacy dolfin-2017 container used here can never import `finmag` on this
    # branch line -- confirmed by log evidence (ModuleNotFoundError/AttributeError
    # on `finmag.example`), not a regression to chase. Scoped out here rather than
    # left red; dolfinx-m4/dolfinx-m5 are this branch's real gates. [Claude Sonnet 5]
    if: github.ref_name != 'dolfinx-parity' && github.head_ref != 'dolfinx-parity'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify Python 3 M1 workflow witness
      run: |
        # Keep this job focused on the practical M1 usability witness, not the full regression gate. [Codex GPT-5.4]
        dev/bin/verify-python3-m1
