name: python3-barmini-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python3-barmini-smoke:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Python 3 DOLFIN 2017 image
      run: |
        docker build \
          -f install/docker/python3-dolfin2017-snapshot/Dockerfile \
          -t finmag-py3-dolfin2017 .

    - name: Verify Python 3 barmini smoke test
      run: |
        docker run --rm \
          -e OMPI_MCA_plm=isolated \
          -v "${GITHUB_WORKSPACE}:/repo:ro" \
          finmag-py3-dolfin2017 \
          bash -lc 'rm -rf /tmp/finmag && cp -a /repo /tmp/finmag && cd /tmp/finmag && \
                    PYTHONPATH=/tmp/finmag/src python3 - <<"PY"
import finmag
sim = finmag.example.barmini(name="barmini_py3_ci")
print("constructed", sim.__class__.__name__)
sim.run_until(1e-12)
print("advanced", sim.t)
PY'
