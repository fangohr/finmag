name: dolfinx-m4

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dolfinx-m4:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.62.1
        cache: true

    - name: Verify DOLFINx M4 dependency probe
      run: |
        # Keep M4 independent from the FEniCS-2019 M2/M3 gates while the
        # DOLFINx port is still only a dependency smoke probe. [Codex gpt-5.5 high]
        dev/bin/verify-dolfinx-m4
