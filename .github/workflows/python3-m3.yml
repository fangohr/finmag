name: python3-m3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python3-m3:
    runs-on: ubuntu-latest
    # Task 32 (2026-07-22): M3 gates the legacy FEniCS-2019 compatibility
    # subset. `pixi` is the frozen legacy oracle for M1-M3
    # (docs/superpowers/HANDOVER.md branch lineage). `dolfinx-parity` has ported
    # src/finmag/field.py to import `dolfinx` unconditionally (direct-source
    # DOLFINx port, Tasks 3-31), so importing `finmag` in the legacy `default`
    # env can never succeed on this branch line -- confirmed by log evidence
    # (`ModuleNotFoundError: No module named 'dolfinx'` from conftest collection),
    # not a regression to chase. Scoped out here rather than left red;
    # dolfinx-m4/dolfinx-m5 are this branch's real gates. [Claude Sonnet 5]
    if: github.ref_name != 'dolfinx-parity' && github.head_ref != 'dolfinx-parity'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.62.1
        cache: true

    - name: Verify Python 3 M3 FEniCS-2019 gate
      run: |
        # Keep the initial M3 gate focused on the barmini-first pytest subset while the 2019 compatibility matrix grows. [Codex GPT-5.4]
        dev/bin/verify-python3-m3
