              src/finmag/energies/exchange_test.py \
                      src/finmag/energies/anisotropy_test.py \
                      src/finmag/energies/cubic_anisotropy_test.py \
                      src/finmag/energies/demag/demag_pbc_test.py \
                      src/finmag/energies/demag/fk_demag_test.py \
                      src/finmag/energies/demag/fk_demag_2d_test.py \
                      src/finmag/energies/test_energies_in_regions.py \
                      src/finmag/energies/magnetostatic_field_test.py \
