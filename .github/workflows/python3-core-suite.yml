                      src/finmag/tests/zhangli/zhang_li_test.py \
                      src/finmag/tests/zhangli/stt_nonlocal_test.py \
                      src/finmag/physics/llb/sllg_test.py \
                      src/finmag/physics/llb/llb_test.py \
