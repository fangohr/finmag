# Task 32 (2026-07-22): probes the historical `finmag/finmag` Docker Hub
# images (:latest, :dependencies). `workflow_dispatch`-only (never fired by
# push/pull_request) since before this task; left that way deliberately rather
# than deleted -- those images predate the pixi/dolfinx transition and are not
# rebuilt by this repo's CI, so an automatic trigger would just be flaky noise
# unrelated to any branch's changes. Kept for manual/historical use only.
# [Claude Sonnet 5]
name: docker-image

on:
  workflow_dispatch:

jobs:
  docker-image:
    runs-on: ubuntu-latest

    steps:
    - name: Pull finmag/finmag:latest
      run: docker pull finmag/finmag:latest

    - name: Run simple command in finmag/finmag:latest
      run: docker run finmag/finmag:latest bash -c "python -c \"import finmag\""

    - name: Pull finmag/finmag:dependencies
      run: docker pull finmag/finmag:dependencies

    - name: Run simple command in finmag/finmag:dependencies
      run: docker run finmag/finmag:dependencies bash -c "python -c \"import dolfin\""
