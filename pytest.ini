[pytest]
addopts = --ignore=dev/sandbox --ignore=install/user-only-system --tb=short
markers =
    slow: long-running or environment-heavy regression tests retained as optional coverage on some gates
    requires_X_display: tests that need an interactive X display or comparable GUI environment
    not_ported: master test carried verbatim; functionality not yet ported to DOLFINx — expected to fail in the inventory lane
